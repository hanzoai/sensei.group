<!DOCTYPE html>
<!-- The theme classes are in the EXPORTED HTML, not applied by the app on
     mount. The ground is painted dark from `:root` while the ink is a themed
     token defaulting to the LIGHT one — so a document that waits for JS to add
     `t_dark` renders #050505 text on the #0a0a0a ground until the bundle lands,
     which on a slow connection is a page of invisible words. These are the same
     two classes the runtime sets, so nothing flashes and nothing is undone when
     it does. -->
<html lang="en" class="t_dark dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensei Group — L3–L9 Certified Human Senseis on hanzo.market</title>
    <meta name="description" content="World-class fractional talent network and curated L3+ certified human Sensei lens on hanzo.market, anchored on Hanzo Network (Chain 36963). Hire elite engineers or escalate tasks autonomously via hire_sensei MCP." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Agent instructions & hire_sensei protocol" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
